<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Conferência de Chassis</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/@zxing/browser@latest"></script>

</head>

<body>

<header>

<h1>Conferência de Chassis</h1>

</header>

<section class="painel">

<div class="card">

<h2>Total</h2>

<span id="total">0</span>

</div>

<div class="card">

<h2>Encontrados</h2>

<span id="encontrados">0</span>

</div>

<div class="card">

<h2>Faltando</h2>

<span id="faltando">0</span>

</div>

<progress id="barra" value="0" max="100"></progress>

</section>

<section>

<input
type="file"
id="excel"
accept=".xlsx">

<button id="importar">

📄 Importar Planilha

</button>

</section>

<section>

<div id="reader"></div>

<button id="scan">

📷 Escanear

</button>

</section>

<section>

<h2 id="status">

Nenhuma planilha carregada

</h2>

</section>

<section>

<button id="faltantes">

📋 Ver Faltantes

</button>

<ul id="lista"></ul>

</section>

<script src="excel.js"></script>

<script src="scanner.js"></script>

<script src="app.js"></script>

</body>

</html>
